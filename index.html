<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>second brain</title>

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="brain">
<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href='data:application/manifest+json,{"name":"second brain","short_name":"brain","start_url":".","display":"standalone","background_color":"%230f0f0f","theme_color":"%230f0f0f"}'>

<style>
:root{
  --bg:#0f0f0f;
  --surface:#171717;
  --surface-2:#1e1e1e;
  --border:#262626;
  --text:#e8e8e8;
  --muted:#8a8a8a;
  --faint:#555;
  --personal:#4A90D9;
  --work:#D4A017;
  --music:#4CAF7D;
  --inbox:#c9c9c9;
  --danger:#c0564f;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text",sans-serif;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:15px;line-height:1.4;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}

/* ---------- layout ---------- */
#app{display:flex;flex-direction:column;height:100dvh}
header{
  padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
#path{
  font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:-.02em;
  color:var(--accent,var(--inbox));
  white-space:nowrap;
}
#path::after{
  content:"";display:inline-block;width:8px;height:16px;margin-left:6px;
  vertical-align:-2px;background:var(--accent,var(--inbox));opacity:.85;
  animation:blink 1.1s steps(1) infinite;
}
@media (prefers-reduced-motion: reduce){
  #path::after{animation:none}
  *{transition:none !important}
}
@keyframes blink{50%{opacity:0}}
#exportBtn{
  font-family:var(--mono);font-size:12px;color:var(--muted);
  border:1px solid var(--border);border-radius:7px;padding:6px 10px;
}
#exportBtn:active{background:var(--surface-2)}

#searchWrap{padding:2px 16px 8px}
#search{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:9px;padding:9px 12px;color:var(--text);
  font-family:var(--mono);font-size:13px;outline:none;
}
#search::placeholder{color:var(--faint)}
#search:focus{border-color:var(--accent,var(--faint))}

#filters{
  display:flex;gap:6px;padding:0 16px 10px;align-items:center;
}
.chip{
  font-family:var(--mono);font-size:11.5px;color:var(--muted);
  border:1px solid var(--border);border-radius:99px;padding:5px 11px;
  text-transform:lowercase;
}
.chip.on{color:var(--bg);background:var(--accent,var(--inbox));border-color:var(--accent,var(--inbox));font-weight:600}
#archToggle{
  margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);
  padding:5px 2px;display:none;
}
#archToggle.show{display:block}
#archToggle.on{color:var(--muted);text-decoration:underline}

/* ---------- list ---------- */
#list{
  flex:1;overflow-y:auto;padding:0 16px;
  padding-bottom:calc(140px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;
}
.card-wrap{position:relative;margin-bottom:8px;border-radius:var(--radius);overflow:hidden}
.swipe-action{
  position:absolute;inset:0;display:flex;justify-content:flex-end;align-items:stretch;
  background:var(--danger);border-radius:var(--radius);
}
.swipe-action button{
  width:84px;color:#fff;font-family:var(--mono);font-size:12px;font-weight:600;
}
.card{
  position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:11px 13px;
  transition:transform .18s ease;will-change:transform;
  touch-action:pan-y;
}
.card .top{display:flex;align-items:baseline;gap:8px}
.badge{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  color:var(--faint);flex-shrink:0;
}
.dot{width:7px;height:7px;border-radius:99px;flex-shrink:0;align-self:center}
.card .title{font-weight:600;font-size:14.5px;flex:1;min-width:0;overflow-wrap:anywhere}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.preview{
  font-size:13px;color:var(--muted);margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  white-space:pre-line;
}
.card.daily{
  background:var(--surface-2);
  border-left:3px solid var(--accent,var(--inbox));
}
.card.daily .badge{color:var(--accent,var(--inbox))}
.card.archived{opacity:.42}
.card.archived .title{text-decoration:line-through;text-decoration-color:var(--faint)}
.empty{
  text-align:center;color:var(--faint);font-family:var(--mono);font-size:12.5px;
  padding:56px 24px;line-height:1.8;
}

/* ---------- FAB ---------- */
#fab{
  position:fixed;right:18px;
  bottom:calc(76px + env(safe-area-inset-bottom));
  width:54px;height:54px;border-radius:16px;
  background:var(--accent,var(--inbox));color:var(--bg);
  font-size:28px;font-weight:300;line-height:1;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 22px rgba(0,0,0,.5);
  z-index:30;
}
#fab:active{transform:scale(.94)}

/* ---------- tab bar ---------- */
#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;
  background:rgba(15,15,15,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabs button{
  flex:1;padding:11px 0 9px;
  font-family:var(--mono);font-size:11px;color:var(--faint);
  display:flex;flex-direction:column;gap:4px;align-items:center;
}
#tabs button .tabdot{width:6px;height:6px;border-radius:99px;background:currentColor;opacity:.5}
#tabs button.on{color:var(--tab-c);font-weight:700}
#tabs button.on .tabdot{opacity:1}

/* ---------- modal ---------- */
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
#overlay.open{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:#161616;border-top:1px solid var(--border);
  border-radius:18px 18px 0 0;
  padding:14px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .25s cubic-bezier(.3,.9,.3,1);
  max-height:88dvh;overflow-y:auto;
}
#sheet.open{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--border);margin:0 auto 14px}
#typeRow{display:flex;gap:8px;margin-bottom:14px}
#typeRow button{
  flex:1;font-family:var(--mono);font-size:12.5px;color:var(--muted);
  border:1px solid var(--border);border-radius:9px;padding:9px 0;text-transform:lowercase;
}
#typeRow button.on{color:var(--text);border-color:var(--m-accent);background:rgba(255,255,255,.04);font-weight:600}
.field{margin-bottom:12px}
.field label{
  display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  color:var(--faint);margin-bottom:5px;text-transform:uppercase;
}
.field input,.field textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:9px;
  padding:10px 12px;outline:none;color:var(--text);
  color-scheme:dark;
}
.field input:focus,.field textarea:focus{border-color:var(--m-accent)}
.field textarea{min-height:130px;resize:vertical;line-height:1.5}
#areaRow{display:flex;gap:8px;margin-bottom:16px}
#areaRow button{
  flex:1;font-family:var(--mono);font-size:12px;color:var(--muted);
  border:1px solid var(--border);border-radius:99px;padding:8px 0;text-transform:lowercase;
}
#areaRow button.on{color:var(--bg);font-weight:700}
#sheetActions{display:flex;gap:10px}
#cancelBtn{
  flex:1;border:1px solid var(--border);border-radius:11px;padding:13px 0;
  color:var(--muted);font-family:var(--mono);font-size:14px;
}
#saveBtn{
  flex:2;border-radius:11px;padding:13px 0;background:var(--m-accent,var(--inbox));
  color:var(--bg);font-weight:700;font-size:15px;
}
#saveBtn:active,#cancelBtn:active{opacity:.8}
#icsBtn{
  width:100%;margin-bottom:12px;border:1px dashed var(--border);border-radius:9px;
  padding:10px 0;color:var(--muted);font-family:var(--mono);font-size:12px;display:none;
}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(12px);
  background:var(--surface-2);border:1px solid var(--border);border-radius:99px;
  padding:8px 18px;font-family:var(--mono);font-size:12px;color:var(--text);
  opacity:0;pointer-events:none;transition:all .25s;z-index:60;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
:focus-visible{outline:2px solid var(--accent,var(--inbox));outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="path">~/inbox</div>
    <button id="exportBtn" aria-label="Export backup">export ↗</button>
  </header>

  <div id="searchWrap">
    <input id="search" type="search" placeholder="search…" autocomplete="off">
  </div>

  <div id="filters">
    <button class="chip on" data-f="all">all</button>
    <button class="chip" data-f="task">tasks</button>
    <button class="chip" data-f="note">notes</button>
    <button class="chip" data-f="event">events</button>
    <button id="archToggle">show archived</button>
  </div>

  <main id="list" aria-live="polite"></main>

  <button id="fab" aria-label="Add new item">+</button>

  <nav id="tabs">
    <button data-tab="inbox"    class="on" style="--tab-c:var(--inbox)"><span class="tabdot"></span>inbox</button>
    <button data-tab="personal" style="--tab-c:var(--personal)"><span class="tabdot"></span>personal</button>
    <button data-tab="work"     style="--tab-c:var(--work)"><span class="tabdot"></span>work</button>
    <button data-tab="music"    style="--tab-c:var(--music)"><span class="tabdot"></span>music</button>
  </nav>
</div>

<div id="overlay"></div>
<div id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div id="typeRow">
    <button data-t="task">task</button>
    <button data-t="note" class="on">note</button>
    <button data-t="event">event</button>
  </div>

  <div class="field"><label for="fTitle">title</label>
    <input id="fTitle" type="text" autocomplete="off"></div>

  <div class="field" id="fBodyWrap"><label for="fBody">body</label>
    <textarea id="fBody"></textarea></div>

  <div class="field" id="fDueWrap" style="display:none"><label for="fDue">due (optional)</label>
    <input id="fDue" type="datetime-local"></div>

  <div class="field" id="fStartWrap" style="display:none"><label for="fStart">start</label>
    <input id="fStart" type="datetime-local"></div>

  <div class="field" id="fEndWrap" style="display:none"><label for="fEnd">end</label>
    <input id="fEnd" type="datetime-local"></div>

  <div id="areaRow"></div>
  <button id="icsBtn">↓ export .ics again</button>

  <div id="sheetActions">
    <button id="cancelBtn">cancel</button>
    <button id="saveBtn">save</button>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

/* ============ config (rename areas here if forking) ============ */
const AREAS = {
  personal:{label:'personal', color:'#4A90D9'},
  work:    {label:'work',     color:'#D4A017'},
  music:   {label:'music',    color:'#4CAF7D'},
};
const AREA_KEYS = Object.keys(AREAS);

/* ============ tiny utils ============ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxx-xxxx-xxxx'.replace(/x/g,()=>Math.floor(Math.random()*16).toString(16)));
const todayKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const fmtDT = iso => {
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' ' +
         d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
};
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(()=>t.classList.remove('show'), 1700);
}

/* ============ IndexedDB ============ */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open('secondbrain', 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      for(const s of ['tasks','notes','events'])
        if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id'});
    };
    req.onsuccess = e => res(e.target.result);
    req.onerror   = e => rej(e.target.error);
  });
}
const dbPut    = (store,obj) => new Promise((res,rej)=>{
  const tx = db.transaction(store,'readwrite');
  tx.objectStore(store).put(obj);
  tx.oncomplete = ()=>res(obj); tx.onerror = ()=>rej(tx.error);
});
const dbGetAll = store => new Promise((res,rej)=>{
  const r = db.transaction(store).objectStore(store).getAll();
  r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
});

/* ============ state ============ */
const state = {
  tab:'inbox', filter:'all', search:'', showArchived:false,
  captureType:'note', captureArea:'personal', editing:null, // {store,item}
};
let cache = {tasks:[], notes:[], events:[]};
async function refreshCache(){
  [cache.tasks, cache.notes, cache.events] =
    await Promise.all([dbGetAll('tasks'), dbGetAll('notes'), dbGetAll('events')]);
}

/* ============ daily note ============ */
async function ensureDailyNote(area){
  if(!AREAS[area]) return;
  const key = todayKey();
  const exists = cache.notes.some(n => n.isDaily && n.area===area && n.date===key);
  if(exists) return;
  const title = 'Daily Note — ' + new Date().toLocaleDateString('en-US',
    {month:'long', day:'numeric', year:'numeric'}).replace(/,/g,'');
  await dbPut('notes',{
    id:uuid(), title, body:'', area, isDaily:true, date:key,
    createdAt:new Date().toISOString()
  });
  await refreshCache();
}

/* ============ handoffs ============ */
function handoffReminder(task){
  let url = 'x-apple-reminderkit://REMCDReminder/?title=' + encodeURIComponent(task.title);
  if(task.dueDate) url += '&dueDate=' + encodeURIComponent(task.dueDate);
  window.location.href = url;
}
function toICSDate(iso){
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
}
function generateICS(ev){
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//secondbrain//EN','BEGIN:VEVENT',
    'UID:'+ev.id, 'SUMMARY:'+ev.title.replace(/[\n,;]/g,' '),
    'DTSTART:'+toICSDate(ev.startDate), 'DTEND:'+toICSDate(ev.endDate),
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
}
async function shareFile(content, name, mime){
  const file = new File([content], name, {type:mime});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type:mime}));
  a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* ============ export ============ */
$('#exportBtn').addEventListener('click', async ()=>{
  await refreshCache();
  const json = JSON.stringify({
    exportedAt:new Date().toISOString(),
    tasks:cache.tasks, notes:cache.notes, events:cache.events
  }, null, 2);
  shareFile(json, `second-brain-backup-${todayKey()}.json`, 'application/json');
});

/* ============ rendering ============ */
function visibleItems(){
  const q = state.search.trim().toLowerCase();
  const inArea = it => state.tab==='inbox' || it.area===state.tab;
  const match  = it => !q || it.title.toLowerCase().includes(q) ||
                  (it.body && it.body.toLowerCase().includes(q));
  let items = [];
  if(state.filter==='all' || state.filter==='task')
    items.push(...cache.tasks.filter(t => inArea(t) && match(t) &&
      (state.showArchived || t.status!=='archived')).map(t=>({...t,_type:'task'})));
  if(state.filter==='all' || state.filter==='note')
    items.push(...cache.notes.filter(n => inArea(n) && match(n)).map(n=>({...n,_type:'note'})));
  if(state.filter==='all' || state.filter==='event')
    items.push(...cache.events.filter(e => inArea(e) && match(e)).map(e=>({...e,_type:'event'})));

  items.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  // pin today's daily notes
  const key = todayKey();
  const pinned = items.filter(i => i.isDaily && i.date===key);
  const rest   = items.filter(i => !(i.isDaily && i.date===key));
  return [...pinned, ...rest];
}

function cardHTML(it){
  const area = AREAS[it.area];
  const dot  = state.tab==='inbox' && area
    ? `<span class="dot" style="background:${area.color}"></span>` : '';
  const daily = it._type==='note' && it.isDaily && it.date===todayKey();
  let badge = it._type.toUpperCase(), meta = '', preview = '';
  if(it._type==='task'){
    if(it.dueDate) meta = `<div class="meta">due ${esc(fmtDT(it.dueDate))}</div>`;
  } else if(it._type==='event'){
    meta = `<div class="meta">${esc(fmtDT(it.startDate))} → ${esc(fmtDT(it.endDate))}</div>`;
  } else {
    if(daily) badge = '▍DAILY';
    if(it.body) preview = `<div class="preview">${esc(it.body)}</div>`;
    else if(daily) preview = `<div class="preview" style="color:var(--faint)">tap to jot something down…</div>`;
  }
  const cls = ['card', daily?'daily':'', it.status==='archived'?'archived':''].join(' ');
  return `
  <div class="card-wrap" data-id="${it.id}" data-type="${it._type}">
    ${it._type==='task' && it.status!=='archived'
      ? `<div class="swipe-action"><button data-arch="${it.id}">archive</button></div>` : ''}
    <div class="${cls}">
      <div class="top">${dot}<span class="badge">${badge}</span><span class="title">${esc(it.title)}</span></div>
      ${meta}${preview}
    </div>
  </div>`;
}

function render(){
  const accent = state.tab==='inbox' ? 'var(--inbox)' : AREAS[state.tab].color;
  document.documentElement.style.setProperty('--accent', accent);
  $('#path').textContent = '~/' + state.tab;
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab===state.tab));
  $$('.chip').forEach(c => c.classList.toggle('on', c.dataset.f===state.filter));

  const items = visibleItems();
  const archivedInScope = cache.tasks.some(t => t.status==='archived' &&
    (state.tab==='inbox' || t.area===state.tab));
  const at = $('#archToggle');
  at.classList.toggle('show', archivedInScope && (state.filter==='all'||state.filter==='task'));
  at.classList.toggle('on', state.showArchived);
  at.textContent = state.showArchived ? 'hide archived' : 'show archived';

  if(!items.length){
    const what = state.filter==='all' ? 'Nothing here yet' : `No ${state.filter}s yet`;
    $('#list').innerHTML = `<div class="empty">${what}.<br>Tap + to add one.</div>`;
    return;
  }
  $('#list').innerHTML = items.map(cardHTML).join('');
  attachSwipe();
}

/* ============ swipe to archive ============ */
function attachSwipe(){
  $$('.card-wrap[data-type="task"]').forEach(wrap=>{
    const card = wrap.querySelector('.card');
    if(!wrap.querySelector('.swipe-action')) return;
    let startX=0, startY=0, dx=0, open=false, dragging=false, horiz=null;

    wrap.addEventListener('pointerdown', e=>{
      startX=e.clientX; startY=e.clientY; dragging=true; horiz=null;
      card.style.transition='none';
    });
    wrap.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const mx=e.clientX-startX, my=e.clientY-startY;
      if(horiz===null && (Math.abs(mx)>6||Math.abs(my)>6)) horiz=Math.abs(mx)>Math.abs(my);
      if(!horiz) return;
      dx = Math.min(0, Math.max(-110, (open?-84:0)+mx));
      card.style.transform = `translateX(${dx}px)`;
    });
    const finish = ()=>{
      if(!dragging) return;
      dragging=false; card.style.transition='';
      open = dx < -42;
      card.style.transform = open ? 'translateX(-84px)' : 'translateX(0)';
      dx = open ? -84 : 0;
    };
    wrap.addEventListener('pointerup', finish);
    wrap.addEventListener('pointercancel', finish);
  });
}
$('#list').addEventListener('click', async e=>{
  const archBtn = e.target.closest('[data-arch]');
  if(archBtn){
    const t = cache.tasks.find(x=>x.id===archBtn.dataset.arch);
    if(t){ t.status='archived'; await dbPut('tasks',t); await refreshCache(); render(); toast('archived'); }
    return;
  }
  const wrap = e.target.closest('.card-wrap');
  if(!wrap) return;
  const card = wrap.querySelector('.card');
  if(card && card.style.transform && card.style.transform!=='translateX(0px)'){
    card.style.transform='translateX(0)'; return; // close swipe instead of opening editor
  }
  openEdit(wrap.dataset.type, wrap.dataset.id);
});

/* ============ capture / edit sheet ============ */
const STORE_OF = {task:'tasks', note:'notes', event:'events'};
function setSheetAccent(){
  $('#sheet').style.setProperty('--m-accent', AREAS[state.captureArea].color);
  $$('#areaRow button').forEach(b=>{
    const on = b.dataset.a===state.captureArea;
    b.classList.toggle('on', on);
    b.style.background = on ? AREAS[b.dataset.a].color : '';
    b.style.borderColor = on ? AREAS[b.dataset.a].color : '';
  });
}
function setSheetType(t){
  state.captureType = t;
  $$('#typeRow button').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  $('#fBodyWrap').style.display  = t==='note'  ? '' : 'none';
  $('#fDueWrap').style.display   = t==='task'  ? '' : 'none';
  $('#fStartWrap').style.display = t==='event' ? '' : 'none';
  $('#fEndWrap').style.display   = t==='event' ? '' : 'none';
}
const isoToLocal = iso => {
  if(!iso) return '';
  const d=new Date(iso), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
};
function openSheet(){
  $('#overlay').classList.add('open'); $('#sheet').classList.add('open');
}
function closeSheet(){
  $('#overlay').classList.remove('open'); $('#sheet').classList.remove('open');
  state.editing=null; $('#icsBtn').style.display='none';
  $('#typeRow').style.display='flex';
  ['#fTitle','#fBody','#fDue','#fStart','#fEnd'].forEach(s=>$(s).value='');
}
function openCapture(){
  state.editing=null;
  state.captureArea = state.tab==='inbox' ? 'personal' : state.tab;
  setSheetType(state.captureType||'note'); setSheetAccent();
  $('#typeRow').style.display='flex'; $('#icsBtn').style.display='none';
  $('#saveBtn').textContent='save';
  openSheet();
  setTimeout(()=>$('#fTitle').focus(), 280);
}
function openEdit(type, id){
  const item = cache[STORE_OF[type]].find(x=>x.id===id);
  if(!item) return;
  state.editing = {store:STORE_OF[type], item};
  state.captureArea = item.area;
  setSheetType(type); setSheetAccent();
  $('#typeRow').style.display='none'; // type is fixed when editing
  $('#fTitle').value = item.title;
  $('#fBody').value  = item.body || '';
  $('#fDue').value   = isoToLocal(item.dueDate);
  $('#fStart').value = isoToLocal(item.startDate);
  $('#fEnd').value   = isoToLocal(item.endDate);
  $('#icsBtn').style.display = type==='event' ? 'block' : 'none';
  $('#saveBtn').textContent='update';
  openSheet();
}

$('#fab').addEventListener('click', openCapture);
$('#overlay').addEventListener('click', closeSheet);
$('#cancelBtn').addEventListener('click', closeSheet);
$$('#typeRow button').forEach(b=>b.addEventListener('click',()=>setSheetType(b.dataset.t)));

// area pills
$('#areaRow').innerHTML = AREA_KEYS.map(k=>
  `<button data-a="${k}">${AREAS[k].label}</button>`).join('');
$$('#areaRow button').forEach(b=>b.addEventListener('click',()=>{
  state.captureArea=b.dataset.a; setSheetAccent();
}));

// event end defaults to start + 1h
$('#fStart').addEventListener('change', ()=>{
  const v=$('#fStart').value;
  if(v && !$('#fEnd').value){
    const d=new Date(v); d.setHours(d.getHours()+1);
    $('#fEnd').value=isoToLocal(d.toISOString());
  }
});

$('#icsBtn').addEventListener('click', ()=>{
  if(state.editing?.item)
    shareFile(generateICS(state.editing.item),
      state.editing.item.title.replace(/\W+/g,'-').toLowerCase()+'.ics','text/calendar');
});

$('#saveBtn').addEventListener('click', async ()=>{
  const title=$('#fTitle').value.trim();
  if(!title){ $('#fTitle').focus(); toast('title required'); return; }
  const t=state.captureType, area=state.captureArea, now=new Date().toISOString();

  if(t==='event'){
    if(!$('#fStart').value){ $('#fStart').focus(); toast('start time required'); return; }
    if(!$('#fEnd').value){
      const d=new Date($('#fStart').value); d.setHours(d.getHours()+1);
      $('#fEnd').value=isoToLocal(d.toISOString());
    }
  }

  if(state.editing){
    const it=state.editing.item;
    it.title=title;
    if(t==='note')  it.body=$('#fBody').value;
    if(t==='task')  it.dueDate=$('#fDue').value?new Date($('#fDue').value).toISOString():null;
    if(t==='event'){
      it.startDate=new Date($('#fStart').value).toISOString();
      it.endDate=new Date($('#fEnd').value).toISOString();
    }
    await dbPut(state.editing.store,it);
    await refreshCache(); render(); closeSheet(); toast('updated');
    return;
  }

  if(t==='task'){
    const task={id:uuid(),title,area,
      dueDate:$('#fDue').value?new Date($('#fDue').value).toISOString():null,
      status:'active',createdAt:now};
    await dbPut('tasks',task);
    await refreshCache(); render(); closeSheet(); toast('saved → reminders');
    handoffReminder(task);
  } else if(t==='note'){
    await dbPut('notes',{id:uuid(),title,body:$('#fBody').value,area,
      isDaily:false,date:null,createdAt:now});
    await refreshCache(); render(); closeSheet(); toast('saved');
  } else {
    const ev={id:uuid(),title,area,
      startDate:new Date($('#fStart').value).toISOString(),
      endDate:new Date($('#fEnd').value).toISOString(),createdAt:now};
    await dbPut('events',ev);
    await refreshCache(); render(); closeSheet(); toast('saved → calendar');
    shareFile(generateICS(ev), title.replace(/\W+/g,'-').toLowerCase()+'.ics','text/calendar');
  }
});

/* ============ top-level controls ============ */
$$('#tabs button').forEach(b=>b.addEventListener('click', async ()=>{
  state.tab=b.dataset.tab; state.showArchived=false;
  await ensureDailyNote(state.tab);
  render();
  $('#list').scrollTop=0;
}));
$$('.chip').forEach(c=>c.addEventListener('click',()=>{state.filter=c.dataset.f;render();}));
$('#archToggle').addEventListener('click',()=>{state.showArchived=!state.showArchived;render();});
$('#search').addEventListener('input',e=>{state.search=e.target.value;render();});

/* ============ service worker (optional sw.js alongside this file) ============ */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{/* offline shell unavailable; app still works online */});
}

/* ============ boot ============ */
(async ()=>{
  db = await openDB();
  await refreshCache();
  render();
})();
</script>
</body>
</html>
